
name: CD - Deploy & DAST

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # ============================================================
  # GATE 8: DEPLOY
  # ============================================================
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deployment Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/bankapp

      - name: Copy app-tier.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app-tier.yml"
          target: "~/bankapp"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Login to ECR using EC2 IAM Role
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            cd ~/bankapp

            # Preserve existing environment credentials
            test -f .env
            chmod 600 .env

            # Update image configuration
            sed -i '/^ECR_REGISTRY=/d' .env
            sed -i '/^ECR_REPOSITORY=/d' .env
            sed -i '/^IMAGE_TAG=/d' .env

            echo "ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> .env
            echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env

            # Pull and deploy
            docker compose -f app-tier.yml pull
            docker compose -f app-tier.yml up -d

  # ============================================================
  # GATE 9: DAST - Dynamic Application Security Testing
  # ============================================================
  dast:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: 'http://${{ secrets.EC2_HOST }}:8080'
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html

